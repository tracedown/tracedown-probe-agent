name: Version bump

# Releasing here is version-driven: release.yml publishes when the version in
# pyproject.toml has no tag yet, so merging a PR that changes shipped code WITHOUT
# bumping it produces no release at all — silently, with nothing to notice
# until someone wonders why the fix never shipped. This turns that into a
# failed check on the PR instead.
#
# Escape hatches, for PRs that genuinely ship nothing: title the PR `WIP:`, or
# label it `no-release` (docs, CI, chores).

on:
  pull_request:
    branches: [main]

jobs:
  version-bump:
    if: >-
      github.repository == 'tracedown/tracedown-probe-agent'
      && !startsWith(github.event.pull_request.title, 'WIP:')
      && !contains(github.event.pull_request.labels.*.name, 'no-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit has to be readable to compare against.
          fetch-depth: 0

      - name: The version must be raised
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION_FILE: pyproject.toml
        run: |
          set -euo pipefail
          extract() { grep -m1 '^version' | sed 's/.*= *"\(.*\)".*/\1/'; }

          head_version="$(extract < "$VERSION_FILE")"
          base_version="$(git show "$BASE_SHA:$VERSION_FILE" | extract)"

          if [ -z "$head_version" ]; then
            echo "::error file=$VERSION_FILE::Could not read a version. The check cannot vouch for this PR."
            exit 1
          fi

          if [ "$head_version" = "$base_version" ]; then
            echo "::error file=$VERSION_FILE::Version is still $head_version, so merging this PR publishes nothing. Bump it, or label the PR 'no-release' if it ships nothing."
            exit 1
          fi

          # "Changed" is not the same question as "bumped". A version that moves
          # DOWN — a bad merge, a typo, a branch cut from the wrong base — passes
          # a not-equal test while behaving exactly like no bump at all: the tag
          # for the lower version already exists, so the release publishes
          # nothing, and the check that exists to catch that reports success.
          # Compare with `sort -V` so the answer is the version order, not string
          # order (0.1.9 vs 0.1.10 disagree on those).
          highest="$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -n1)"
          if [ "$highest" != "$head_version" ]; then
            echo "::error file=$VERSION_FILE::Version went backwards, $base_version -> $head_version. A release has to be a higher version than the base."
            exit 1
          fi

          echo "$base_version -> $head_version"
