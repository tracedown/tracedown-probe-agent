name: Docker Publish

# Publishes the probe agent image to Docker Hub — the agent is the one piece
# operators deploy many times in many places, so `docker run` must be enough.
#
# Runs on every push to main: `:latest` always tracks main, and when the
# pyproject version has not been published yet the same build is also pushed
# as `:X.Y.Z` — so merging a version-bump PR ships the versioned image, in
# lockstep with the Release workflow. Published version tags are never
# overwritten.
#
# Requires two repository (or org) secrets:
#   DOCKERHUB_USERNAME — Docker Hub account/namespace the image lives under
#   DOCKERHUB_TOKEN    — access token with write scope
# The job skips gracefully when they are not configured.

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build & push image
    # Upstream-only: forks build via CI but never publish.
    if: github.repository == 'tracedown/tracedown-probe-agent'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Docker Hub credentials
        id: creds
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USER" ] && [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set — skipping publish."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        if: steps.creds.outputs.ok == 'true'
        id: tags
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tracedown-probe-agent
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Version $VERSION already published — pushing :latest only."
            echo "tags=$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "New version $VERSION — pushing :$VERSION and :latest."
            echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup QEMU
        if: steps.creds.outputs.ok == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        if: steps.creds.outputs.ok == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push (amd64 + arm64)
        if: steps.creds.outputs.ok == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
