[project]
name = "tracedown-probe-agent"
version = "0.2.0"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "boto3>=1.35.0",
    "lacelang-validator>=0.1.4,<0.2",
    "lacelang-executor>=0.1.6,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
